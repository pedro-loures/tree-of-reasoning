<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capitals Experiment Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1117;
    --panel: #1a1d27;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --border: #2d3142;
    --accent: #6ea8fe;
    --bad: #e57373;
    --bad-node: #c62828;
    --mostly-bad: #f4a261;
    --good: #7dcea0;
    --good-node: #2e7d32;
    --ditched: #5c6370;
    --expanded: #ff9800;
    --expanded-ditched: #9575cd;
    --leaf: #888;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .tabs { display: flex; gap: 8px; margin-top: 12px; }
  .tab-btn {
    background: #222; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 14px; cursor: pointer;
  }
  .tab-btn.active { border-color: var(--accent); background: #1e2a3d; color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  .layout { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 160px); }
  .graph-wrap { position: relative; overflow: hidden; border-right: 1px solid var(--border); }
  #graph { width: 100%; height: 100%; cursor: grab; }
  #graph:active { cursor: grabbing; }
  .sidebar { overflow-y: auto; padding: 16px; background: var(--panel); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  select, button { background: #222; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  button:hover { border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  .card { background: #12151c; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; }
  .leaf-card { border-left: 4px solid var(--leaf); }
  .leaf-card.correct { border-left-color: var(--good); }
  .leaf-card.incorrect { border-left-color: var(--bad); }
  .leaf-card.neutral { border-left-color: var(--internal); }
  .node-card { border-left: 4px solid var(--bad-node); cursor: pointer; }
  .node-card.mostly-bad { border-left-color: var(--mostly-bad); }
  .node-card.exclusively-good { border-left-color: var(--good-node); }
  .node-card:hover { border-color: var(--accent); }
  .answer { font-size: 13px; line-height: 1.45; word-break: break-word; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; }
  .pill.yes { background: #16361f; color: var(--good); }
  .pill.no { background: #3a1717; color: var(--bad); }
  .pill.bad-node { background: #4a1515; color: #ff8a80; }
  .pill.mostly-bad { background: #4a3510; color: var(--mostly-bad); }
  .pill.good-node { background: #16361f; color: var(--good-node); }
  .pill.ditched { background: #2a2d36; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #tooltip {
    position: fixed; pointer-events: none; z-index: 100;
    background: #1e2230; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; max-width: 340px; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  #tooltip .tok { font-family: ui-monospace, monospace; font-size: 13px; margin-bottom: 4px; }
  .error { color: var(--bad); }
  .toolbar { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; }
  input[type="checkbox"] { accent-color: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .stat { background: #0f1117; border-radius: 6px; padding: 8px; text-align: center; }
  .stat strong { display: block; font-size: 18px; }
  .summary-wrap { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .summary-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
  .summary-table-wrap { overflow-x: auto; margin-bottom: 24px; max-width: 100%; }
  table.summary { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  table.summary th, table.summary td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: right;
    background: var(--bg);
  }
  table.summary th { background: var(--panel); color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  table.summary th.frozen, table.summary td.frozen {
    position: sticky;
    z-index: 2;
  }
  table.summary th.frozen { z-index: 4; background: var(--panel); }
  table.summary td.frozen { background: var(--bg); }
  table.summary th.frozen-last, table.summary td.frozen-last {
    box-shadow: 4px 0 8px rgba(0, 0, 0, 0.35);
  }
  table.summary th.highlight.frozen, table.summary td.highlight.frozen { background: #151b28; }
  table.summary tr:hover td { background: #151922; }
  table.summary tr:hover td.frozen { background: #151922; }
  table.summary tr:hover td.highlight.frozen { background: #1a2233; }
  .freeze-toggles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px 10px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #12151c;
    max-height: 140px;
    overflow: auto;
    min-width: min(100%, 720px);
  }
  .freeze-toggles label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  table.summary th:hover { color: var(--accent); }
  table.summary th.highlight, table.summary td.highlight {
    background: #151b28;
    color: #cfe0ff;
  }
  .chart-row { margin-bottom: 20px; }
  .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .chart-card h3 { margin: 0 0 8px; font-size: 13px; }
  .chart { width: 100%; height: 280px; }
  .progress-bar { height: 6px; background: #222; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .bad-filter {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 8px 0; font-size: 12px;
  }
  .bad-filter label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .preset-btn {
    background: #222; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 900px) {
    .chart-row { grid-template-columns: 1fr; }
    .layout { grid-template-columns: 1fr; height: auto; min-height: 70vh; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Capitals Experiment Dashboard</h1>
  <p class="muted" id="source">Loading…</p>
  <div class="progress-bar" title="Bad-nodes analysis progress">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="summary">Summary</button>
    <button type="button" class="tab-btn" data-tab="trees">Tree Explorer</button>
  </div>
</header>

<div id="summaryPanel" class="panel active">
  <div class="summary-wrap">
    <div class="stat-grid" id="globalStats"></div>
    <div class="summary-controls">
      <label>Prefix length
        <select id="prefixFilter"><option value="">All prefixes</option></select>
      </label>
      <label>Instruction
        <select id="variantFilter">
          <option value="">All variants</option>
          <option value="legacy">legacy</option>
          <option value="plain">plain</option>
        </select>
      </label>
      <label>Region
        <select id="summaryRegionFilter"><option value="">All regions</option></select>
      </label>
      <label>Country
        <select id="summaryCountryFilter"><option value="">All countries</option></select>
      </label>
      <label>Aggregate by
        <select id="aggSelect">
          <option value="whole">Whole (filtered)</option>
          <option value="by_region">Region</option>
          <option value="by_country">Country</option>
          <option value="by_prefix_length">Prefix length</option>
          <option value="by_instruction_variant">Instruction variant</option>
        </select>
      </label>
      <label>Chart column
        <select id="metricSelect"></select>
      </label>
      <div>
        <div class="muted" style="margin-bottom:4px;display:flex;gap:8px;align-items:center">
          Freeze columns
          <button type="button" class="preset-btn" id="freezeDefaultBtn">Group only</button>
          <button type="button" class="preset-btn" id="freezeClearBtn">Clear all</button>
        </div>
        <div id="freezeColumnToggles" class="freeze-toggles"></div>
      </div>
    </div>
    <p class="muted" id="filterHint" style="margin:0 0 12px"></p>
    <div class="chart-row">
      <div class="chart-card">
        <h3 id="barChartTitle">Metric by group</h3>
        <svg class="chart" id="barChart"></svg>
      </div>
    </div>
    <div class="summary-table-wrap">
      <table class="summary" id="summaryTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div id="treesPanel" class="panel">
  <header style="border-top: 1px solid var(--border); padding-top: 12px;">
    <div class="controls">
      <label>Region
        <select id="regionFilter"><option value="">All regions</option></select>
      </label>
      <label>Country
        <select id="countryFilter"><option value="">All countries</option></select>
      </label>
      <label>Run
        <select id="runSelect"></select>
      </label>
      <label>Min edge prob
        <select id="probFilter">
          <option value="0">0 (show all)</option>
          <option value="0.001">0.001</option>
          <option value="0.01" selected>0.01 (τ)</option>
          <option value="0.05">0.05</option>
        </select>
      </label>
      <div class="bad-filter">
        <span class="muted">Count as bad:</span>
        <label><input type="checkbox" id="badFilter_wrong_city" checked /> Wrong city</label>
        <label><input type="checkbox" id="badFilter_empty" checked /> No answer</label>
        <label><input type="checkbox" id="badFilter_incomplete" checked /> Incomplete</label>
        <label><input type="checkbox" id="badFilter_lorem_drift" checked /> Lorem drift</label>
        <button type="button" class="preset-btn" id="badPresetAll">All failures</button>
        <button type="button" class="preset-btn" id="badPresetWrongOnly">Wrong city only</button>
      </div>
      <div class="toolbar">
        <label><input type="checkbox" id="highlightBadOnly" /> Dim outside exclusively-bad subtrees</label>
        <label><input type="checkbox" id="showExpandedOnly" /> Show expanded subtrees only</label>
        <button type="button" id="fitBtn">Fit to screen</button>
        <button type="button" id="resetBtn">Reset zoom</button>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:var(--bad-node)"></i> 100% bad (red)</span>
      <span><i style="background:var(--mostly-bad)"></i> &gt;75% bad (yellow)</span>
      <span><i style="background:var(--good-node)"></i> 100% good (green)</span>
      <span><i style="background:var(--ditched)"></i> ditched candidate</span>
      <span><i style="background:var(--expanded); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--expanded)"></i> expanded excl. bad (orange ring)</span>
      <span><i style="background:var(--expanded-ditched)"></i> ditched after expand</span>
      <span class="muted" id="badModeLegend">bad = wrong + no answer</span>
    </div>
  </header>
  <div class="layout">
    <div class="graph-wrap">
      <svg id="graph"></svg>
      <div id="tooltip"></div>
    </div>
    <aside class="sidebar">
      <div class="card">
        <h3>Run summary</h3>
        <div id="runMeta" class="muted">—</div>
        <div class="stat-grid" id="statGrid"></div>
      </div>
      <div class="card">
        <h3>Nodes by error rate</h3>
        <div id="badNodeList" class="muted">—</div>
      </div>
      <h2 style="font-size:14px; margin:0 0 8px" id="detailTitle">Leaf completions</h2>
      <div id="detailPanel"></div>
    </aside>
  </div>
</div>

<script>
const MODEL_LABELS = {"deepseek-r1-7b":"DeepSeek-R1-7B","qwq-32b-awq":"QwQ-32B-AWQ"};
const TABLE_COLUMNS = [
  { key: "label", label: "Group", align: "left", chartable: false, freezeDefault: true },
  { key: "trees", label: "Trees", chartable: true },
  { key: "bad_nodes_analyzed", label: "Bad-nodes done", chartable: true },
  { key: "avg_max_depth", label: "Avg max depth", chartable: true },
  { key: "avg_total_nodes", label: "Avg nodes", chartable: true },
  { key: "avg_leaf_count", label: "Avg τ-leaves", chartable: true },
  { key: "avg_mass_above_tau", label: "Avg mass above τ", chartable: true },
  { key: "avg_max_breadth", label: "Avg max breadth", chartable: true },
  { key: "avg_mean_breadth_by_depth", label: "Avg breadth/depth", chartable: true },
  { key: "avg_breadth_warnings", label: "Avg breadth warnings", chartable: true },
  { key: "avg_reasoning_tokens", label: "Avg reasoning tokens", chartable: true },
  { key: "avg_mean_entropy", label: "Avg entropy", chartable: true },
  { key: "avg_mean_logprob", label: "Avg logprob", chartable: true },
  { key: "avg_exclusively_bad", label: "Avg excl. bad", chartable: true },
  { key: "avg_ditched", label: "Avg ditched", chartable: true },
  { key: "nodes_expanded", label: "Expanded", chartable: true, highlight: true },
  { key: "nodes_ditched_after", label: "Ditched after expand", chartable: true },
  { key: "avg_tau_star", label: "Avg τ*", chartable: true },
  { key: "avg_candidates", label: "Avg candidates", chartable: true },
  { key: "avg_leaves", label: "Avg probe leaves", chartable: true },
  { key: "leaf_accuracy_pct", label: "Leaf acc % (count)", chartable: true },
  { key: "prob_good_pct", label: "P(good) %", chartable: true, highlight: true },
  { key: "prob_bad_pct", label: "P(bad) %", chartable: true, highlight: true },
  { key: "prob_other_pct", label: "P(other) %", chartable: true, highlight: true },
  { key: "greedy_accuracy_pct", label: "Greedy acc %", chartable: true },
  { key: "top_1_accuracy_pct", label: "Top-1 acc %", chartable: true },
  { key: "top_k_accuracy_pct", label: "Top-k acc %", chartable: true },
];

let DATA = null;
let treeProbMassIndex = new Map();
let currentRun = null;
let currentNodes = [];
let leafMap = new Map();
let statusMap = new Map();
let exclusivelyBadHighlightSet = new Set();
let expandedSubtreeHighlightSet = new Set();
let statsMap = new Map();
let expansionMap = new Map();
let zoomBehavior = null;
let svg = null;
let gRoot = null;
let selectedNodeId = null;
let sortKey = "label";
let sortAsc = true;
let frozenColumnKeys = new Set(
  TABLE_COLUMNS.filter(col => col.freezeDefault).map(col => col.key)
);

function loadFrozenColumns() {
  try {
    const saved = JSON.parse(localStorage.getItem("capitalsFrozenCols") || "null");
    if (Array.isArray(saved)) {
      frozenColumnKeys = new Set(
        saved.filter(key => TABLE_COLUMNS.some(col => col.key === key))
      );
    }
  } catch {
    frozenColumnKeys = new Set(
      TABLE_COLUMNS.filter(col => col.freezeDefault).map(col => col.key)
    );
  }
}

function saveFrozenColumns() {
  localStorage.setItem("capitalsFrozenCols", JSON.stringify([...frozenColumnKeys]));
}

function renderFreezeColumnToggles() {
  const container = document.getElementById("freezeColumnToggles");
  if (!container) return;
  container.innerHTML = TABLE_COLUMNS.map(col => `
    <label title="${col.label}">
      <input type="checkbox" data-freeze-key="${col.key}" ${frozenColumnKeys.has(col.key) ? "checked" : ""} />
      ${col.label}
    </label>
  `).join("");
  container.querySelectorAll("input[data-freeze-key]").forEach(input => {
    input.addEventListener("change", () => {
      const key = input.dataset.freezeKey;
      if (input.checked) frozenColumnKeys.add(key);
      else frozenColumnKeys.delete(key);
      saveFrozenColumns();
      applyFrozenColumns();
    });
  });
}

function applyFrozenColumns() {
  const table = document.getElementById("summaryTable");
  if (!table) return;

  const headerCells = [...table.querySelectorAll("thead th")];
  if (!headerCells.length) return;

  const offsets = new Map();
  let left = 0;
  headerCells.forEach((th, index) => {
    const key = th.dataset.key;
    if (frozenColumnKeys.has(key)) offsets.set(index, left);
    left += th.offsetWidth;
  });

  const isFrozenRunEnd = index => {
    if (!offsets.has(index)) return false;
    const nextKey = headerCells[index + 1]?.dataset.key;
    return !nextKey || !frozenColumnKeys.has(nextKey);
  };

  const syncCell = (cell, index) => {
    const frozen = offsets.has(index);
    cell.classList.toggle("frozen", frozen);
    cell.classList.toggle("frozen-last", frozen && isFrozenRunEnd(index));
    cell.style.left = frozen ? `${offsets.get(index)}px` : "";
    cell.style.zIndex = frozen ? String(3 + index) : "";
  };

  headerCells.forEach((th, index) => syncCell(th, index));
  table.querySelectorAll("tbody tr").forEach(row => {
    [...row.children].forEach((td, index) => syncCell(td, index));
  });
}

function displayToken(token) {
  if (!token) return "⟨prompt⟩";
  if (token === "\n") return "\\n";
  if (token === "\t") return "\\t";
  if (token === " ") return "·";
  return token;
}

function fmtProb(p) {
  if (p >= 0.0001) return p.toFixed(4);
  return p.toExponential(2);
}

function escapeHtml(text) {
  return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function fmtVal(v) {
  if (v === null || v === undefined) return "—";
  return v;
}

function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === name);
  });
  document.querySelectorAll(".panel").forEach(panel => {
    panel.classList.toggle("active", panel.id === name + "Panel");
  });
  if (name === "trees" && currentRun) {
    setTimeout(() => loadRun(currentRun.tree_key), 50);
  }
}

function renderGlobalStats() {
  const filtered = filteredSummaries();
  const whole = aggregateSummaries(filtered, "whole")[0] || {};
  const pct = DATA.mech_interp_trees
    ? Math.round(100 * DATA.bad_nodes_trees / DATA.mech_interp_trees)
    : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("globalStats").innerHTML = `
    <div class="stat"><strong>${DATA.mech_interp_trees}</strong><span class="muted">τ-trees built</span></div>
    <div class="stat"><strong>${DATA.bad_nodes_trees}</strong><span class="muted">bad-nodes analyzed</span></div>
    <div class="stat"><strong>${fmtVal(whole.prob_good_pct)}%</strong><span class="muted">P(good) mass</span></div>
    <div class="stat"><strong>${fmtVal(whole.prob_bad_pct)}%</strong><span class="muted">P(bad) mass</span></div>
    <div class="stat"><strong>${fmtVal(whole.greedy_accuracy_pct)}%</strong><span class="muted">greedy accuracy</span></div>
    <div class="stat"><strong>${fmtVal(whole.leaf_accuracy_pct)}%</strong><span class="muted">leaf acc (count)</span></div>
  `;
}

function filteredSummaries() {
  const prefix = document.getElementById("prefixFilter").value;
  const variant = document.getElementById("variantFilter").value;
  const region = document.getElementById("summaryRegionFilter").value;
  const country = document.getElementById("summaryCountryFilter").value;
  return DATA.tree_summaries.filter(row => {
    if (prefix && String(row.prefix_length) !== prefix) return false;
    if (variant && row.instruction_variant !== variant) return false;
    if (region && row.region_id !== region) return false;
    if (country && row.country_id !== country) return false;
    return true;
  });
}

function emptyBucket() {
  return {
    trees: 0,
    bad_nodes_analyzed: 0,
    max_depth: 0,
    total_nodes: 0,
    leaf_count: 0,
    mass_above_tau: 0,
    max_breadth: 0,
    mean_breadth_by_depth: 0,
    breadth_warnings: 0,
    reasoning_tokens: 0,
    mean_entropy: 0,
    mean_logprob: 0,
    exclusively_bad: 0,
    ditched: 0,
    candidates: 0,
    probe_leaves: 0,
    leaf_correct: 0,
    prob_mass_total: 0,
    prob_good: 0,
    prob_bad: 0,
    prob_other: 0,
    greedy_correct: 0,
    top_1_correct: 0,
    top_k_correct: 0,
    _breadth_depth_n: 0,
    _mass_n: 0,
    _entropy_n: 0,
    _logprob_n: 0,
    _bad_metric_n: 0,
    nodes_expanded: 0,
    nodes_ditched_after: 0,
    tau_star_sum: 0,
    _tau_star_n: 0,
    _expansion_n: 0,
  };
}

function probMassForSummaryRow(row) {
  if (row.prob_mass_total != null && row.prob_good != null) {
    return {
      totalMass: Number(row.prob_mass_total) || 0,
      probGood: Number(row.prob_good) || 0,
      probBad: Number(row.prob_bad) || 0,
      probOther: Number(row.prob_other) || 0,
    };
  }
  return treeProbMassIndex.get(row.tree_key) || {
    totalMass: 0,
    probGood: 0,
    probBad: 0,
    probOther: 0,
  };
}

function buildTreeProbMassIndex() {
  const index = new Map();
  for (const [treeKey, leafObj] of Object.entries(DATA.leaf_completions || {})) {
    index.set(treeKey, computeDefaultLeafProbabilityMasses(Object.values(leafObj || {})));
  }
  return index;
}

function computeDefaultLeafProbabilityMasses(leaves) {
  let totalMass = 0;
  let probGood = 0;
  let probBad = 0;
  for (const leaf of leaves) {
    const pathProb = Number(leaf?.path_prob) || 0;
    totalMass += pathProb;
    if (leaf?.answer_correct) probGood += pathProb;
    else probBad += pathProb;
  }
  return { totalMass, probGood, probBad, probOther: 0 };
}

function addToBucket(bucket, row) {
  bucket.trees += 1;
  if (row.max_depth != null) bucket.max_depth += row.max_depth;
  if (row.total_nodes != null) bucket.total_nodes += row.total_nodes;
  if (row.leaf_count != null) bucket.leaf_count += row.leaf_count;
  if (row.mass_above_tau != null) { bucket.mass_above_tau += row.mass_above_tau; bucket._mass_n += 1; }
  if (row.max_breadth != null) bucket.max_breadth += row.max_breadth;
  if (row.mean_breadth_by_depth != null) {
    bucket.mean_breadth_by_depth += row.mean_breadth_by_depth;
    bucket._breadth_depth_n += 1;
  }
  if (row.breadth_warning_count != null) bucket.breadth_warnings += row.breadth_warning_count;
  if (row.reasoning_token_count != null) bucket.reasoning_tokens += row.reasoning_token_count;
  if (row.mean_entropy_reasoning != null) { bucket.mean_entropy += row.mean_entropy_reasoning; bucket._entropy_n += 1; }
  if (row.mean_logprob_selected != null) { bucket.mean_logprob += row.mean_logprob_selected; bucket._logprob_n += 1; }
  bucket.greedy_correct += row.greedy_correct || 0;
  bucket.top_1_correct += row.top_1_correct || 0;
  bucket.top_k_correct += row.top_k_any_correct || 0;
  if (row.has_bad_nodes) {
    bucket.bad_nodes_analyzed += 1;
    bucket._bad_metric_n += 1;
    bucket.exclusively_bad += row.exclusively_bad_count || 0;
    bucket.ditched += row.ditched_count || 0;
    bucket.candidates += row.total_candidates || 0;
    bucket.probe_leaves += row.total_leaves || 0;
    bucket.leaf_correct += row.leaf_correct || 0;
    const masses = probMassForSummaryRow(row);
    bucket.prob_mass_total += masses.totalMass;
    bucket.prob_good += masses.probGood;
    bucket.prob_bad += masses.probBad;
    bucket.prob_other += masses.probOther;
  }
  if (row.nodes_expanded != null) {
    bucket._expansion_n += 1;
    bucket.nodes_expanded += row.nodes_expanded || 0;
    bucket.nodes_ditched_after += row.nodes_ditched_after || 0;
    if (row.avg_tau_star != null) {
      bucket.tau_star_sum += row.avg_tau_star;
      bucket._tau_star_n += 1;
    }
  }
}

function finalizeBucket(key, label, bucket) {
  const trees = bucket.trees || 1;
  const badN = bucket._bad_metric_n || 0;
  const probeLeaves = bucket.probe_leaves || 0;
  const round2 = v => (v == null ? null : Math.round(v * 100) / 100);
  const round1 = v => (v == null ? null : Math.round(v * 10) / 10);
  return {
    key,
    label,
    trees: bucket.trees,
    bad_nodes_analyzed: bucket.bad_nodes_analyzed,
    avg_max_depth: round2(bucket.max_depth / trees),
    avg_total_nodes: round2(bucket.total_nodes / trees),
    avg_leaf_count: round2(bucket.leaf_count / trees),
    avg_mass_above_tau: bucket._mass_n ? round2(bucket.mass_above_tau / bucket._mass_n) : null,
    avg_max_breadth: round2(bucket.max_breadth / trees),
    avg_mean_breadth_by_depth: bucket._breadth_depth_n
      ? round2(bucket.mean_breadth_by_depth / bucket._breadth_depth_n) : null,
    avg_breadth_warnings: round2(bucket.breadth_warnings / trees),
    avg_reasoning_tokens: round2(bucket.reasoning_tokens / trees),
    avg_mean_entropy: bucket._entropy_n ? round2(bucket.mean_entropy / bucket._entropy_n) : null,
    avg_mean_logprob: bucket._logprob_n ? round2(bucket.mean_logprob / bucket._logprob_n) : null,
    avg_exclusively_bad: badN ? round2(bucket.exclusively_bad / badN) : null,
    avg_ditched: badN ? round2(bucket.ditched / badN) : null,
    nodes_expanded: bucket._expansion_n ? round2(bucket.nodes_expanded / bucket._expansion_n) : null,
    nodes_ditched_after: bucket._expansion_n
      ? round2(bucket.nodes_ditched_after / bucket._expansion_n) : null,
    avg_tau_star: bucket._tau_star_n ? round2(bucket.tau_star_sum / bucket._tau_star_n) : null,
    avg_candidates: badN ? round2(bucket.candidates / badN) : null,
    avg_leaves: badN ? round2(bucket.probe_leaves / badN) : null,
    leaf_accuracy_pct: probeLeaves ? round1(100 * bucket.leaf_correct / probeLeaves) : null,
    prob_good_pct: bucket.prob_mass_total
      ? round1(100 * bucket.prob_good / bucket.prob_mass_total) : null,
    prob_bad_pct: bucket.prob_mass_total
      ? round1(100 * bucket.prob_bad / bucket.prob_mass_total) : null,
    prob_other_pct: bucket.prob_mass_total
      ? round1(100 * bucket.prob_other / bucket.prob_mass_total) : null,
    greedy_accuracy_pct: round1(100 * bucket.greedy_correct / trees),
    top_1_accuracy_pct: round1(100 * bucket.top_1_correct / trees),
    top_k_accuracy_pct: round1(100 * bucket.top_k_correct / trees),
  };
}

function groupMeta(row, dimension) {
  if (dimension === "whole") return { key: "all", label: "All (filtered)" };
  if (dimension === "by_region") return { key: row.region_id, label: row.region_label };
  if (dimension === "by_country") return { key: row.country_id, label: row.country_name };
  if (dimension === "by_prefix_length") return { key: String(row.prefix_length), label: `prefix ${row.prefix_length}` };
  return { key: row.instruction_variant, label: row.instruction_variant };
}

function aggregateSummaries(rows, dimension) {
  if (!rows.length) return [];
  if (dimension === "whole") {
    const bucket = emptyBucket();
    rows.forEach(row => addToBucket(bucket, row));
    return [finalizeBucket("all", "All (filtered)", bucket)];
  }
  const buckets = new Map();
  const labels = new Map();
  for (const row of rows) {
    const meta = groupMeta(row, dimension);
    if (!buckets.has(meta.key)) buckets.set(meta.key, emptyBucket());
    labels.set(meta.key, meta.label);
    addToBucket(buckets.get(meta.key), row);
  }
  return [...buckets.entries()]
    .map(([key, bucket]) => finalizeBucket(key, labels.get(key), bucket))
    .sort((a, b) => {
      if (dimension === "by_prefix_length") return Number(a.key) - Number(b.key);
      return a.label.localeCompare(b.label);
    });
}

function currentAggRows() {

}

function sortRows(rows) {
  return rows.sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];

    if (bv === null || bv === undefined) return -1;
    if (typeof av === "string") return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortAsc ? av - bv : bv - av;
  });
}

function renderBarChart(rows, metricKey) {
  const svgEl = d3.select("#barChart");
  svgEl.selectAll("*").remove();
  const width = svgEl.node().clientWidth || 600;
  const height = 280;
  const margin = { top: 12, right: 12, bottom: 80, left: 48 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;
  const g = svgEl.attr("viewBox", `0 0 ${width} ${height}`).append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const data = rows.filter(r => r[metricKey] !== null && r[metricKey] !== undefined);
  if (!data.length) {
    document.getElementById("barChartTitle").textContent = "No data for selected column";
    return;
  }
  const x = d3.scaleBand().domain(data.map(d => d.label)).range([0, innerW]).padding(0.2);
  const minVal = Math.min(0, d3.min(data, d => d[metricKey]) || 0);
  const maxVal = d3.max(data, d => d[metricKey]) || 1;
  const y = d3.scaleLinear().domain([minVal, maxVal]).nice().range([innerH, 0]);

  g.append("g").attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x))
    .selectAll("text")
    .attr("transform", "rotate(-35)")
    .style("text-anchor", "end")
    .attr("fill", "#9aa0a6")
    .attr("font-size", "10px");

  g.append("g").call(d3.axisLeft(y).ticks(5)).attr("color", "#555");

  g.selectAll(".bar")
    .data(data)
    .join("rect")
    .attr("class", "bar")
    .attr("x", d => x(d.label))
    .attr("y", d => y(Math.max(d[metricKey], 0)))
    .attr("width", x.bandwidth())
    .attr("height", d => Math.abs(y(d[metricKey]) - y(0)))

    .attr("rx", 3);

  const metricLabel = document.getElementById("metricSelect").selectedOptions[0].textContent;
  document.getElementById("barChartTitle").textContent = metricLabel + " by group";
}

function leafDescendants(nodes, nodeId) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  function walk(id) {
    const node = byId[id];
    if (!node.c || !node.c.length) return [id];
    return node.c.flatMap(walk);
  }
  return walk(nodeId);
}

const BAD_SUBTYPE_OPTIONS = [
  { id: "wrong_city", label: "wrong city" },
  { id: "empty", label: "no answer" },
  { id: "incomplete", label: "incomplete" },
  { id: "lorem_drift", label: "lorem drift" },
];

function activeBadSubtypes() {
  return BAD_SUBTYPE_OPTIONS
    .filter(item => document.getElementById(`badFilter_${item.id}`)?.checked)
    .map(item => item.id);
}

function setBadSubtypeFilters(subtypes) {
  const active = new Set(subtypes);
  for (const item of BAD_SUBTYPE_OPTIONS) {
    const el = document.getElementById(`badFilter_${item.id}`);
    if (el) el.checked = active.has(item.id);
  }
}

function badFilterLegend() {
  const active = activeBadSubtypes();
  if (!active.length) return "bad = none selected (nothing counts as bad)";
  const labels = BAD_SUBTYPE_OPTIONS
    .filter(item => active.includes(item.id))
    .map(item => item.label);
  return `bad = ${labels.join(", ")}`;
}

const SUBTYPE_LABELS = {
  correct: "correct",
  wrong_city: "wrong city",
  incomplete: "incomplete",
  empty: "no answer",
  lorem_drift: "lorem drift",
};

function classifyBadSubtypes(leaf) {
  if (!leaf) return ["empty"];
  if (leaf.answer_correct) return ["correct"];
  const subtypes = [];
  if (!leaf.reasoning_complete) subtypes.push("incomplete");
  if (!leaf.answer_text || !String(leaf.answer_text).trim()) subtypes.push("empty");
  if (leaf.mentions_lorem) subtypes.push("lorem_drift");
  if (leaf.reasoning_complete && leaf.answer_text && String(leaf.answer_text).trim()) {
    subtypes.push("wrong_city");
  }
  return subtypes;
}

function isLeafBad(leaf) {
  const subtypes = classifyBadSubtypes(leaf);
  if (subtypes.includes("correct")) return false;
  const active = activeBadSubtypes();
  if (!active.length) return false;
  return subtypes.some(subtype => active.includes(subtype));
}

function isLeafCorrect(leaf) {
  return classifyBadSubtypes(leaf).includes("correct");
}

function isLeafNeutral(leaf) {
  return leaf && !isLeafCorrect(leaf) && !isLeafBad(leaf);
}

function computeLeafProbabilityMasses(leaves) {
  let totalMass = 0;
  let probGood = 0;
  let probBad = 0;
  let probOther = 0;
  for (const leaf of leaves) {
    const pathProb = Number(leaf?.path_prob) || 0;
    totalMass += pathProb;
    if (isLeafCorrect(leaf)) probGood += pathProb;
    else if (isLeafBad(leaf)) probBad += pathProb;
    else probOther += pathProb;
  }
  const pct = v => (totalMass ? Math.round((1000 * v) / totalMass) / 10 : null);
  return {
    totalMass,
    probGood,
    probBad,
    probOther,
    probGoodPct: pct(probGood),
    probBadPct: pct(probBad),
    probOtherPct: pct(probOther),
  };
}

function classifyNodeColor(nBad, nGood, nLeaves) {
  if (nBad === nLeaves) return "exclusively_bad";
  if (nGood === nLeaves) return "exclusively_good";
  if (nBad / nLeaves > 0.75) return "mostly_bad";
  return "mixed";
}

function computeNodeErrorStatsMap(nodes, leafMap) {
  const stats = new Map();
  for (const node of nodes) {
    const leafIds = leafDescendants(nodes, node.id);
    if (!leafIds.length) continue;
    const leaves = leafIds.map(id => leafMap.get(id)).filter(Boolean);
    const nBad = leaves.filter(leaf => isLeafBad(leaf)).length;
    const nGood = leaves.filter(leaf => isLeafCorrect(leaf)).length;
    const nNeutral = leaves.length - nBad - nGood;
    const nLeaves = leaves.length;
    const badPct = nBad / nLeaves;
    stats.set(node.id, {
      n_leaves: nLeaves,
      n_bad: nBad,
      n_good: nGood,
      n_neutral: nNeutral,
      bad_pct: badPct,
      bad_pct_display: Math.round(badPct * 1000) / 10,
      color_class: classifyNodeColor(nBad, nGood, nLeaves),
    });
  }
  return stats;
}

function buildParentMap(nodes) {
  const parent = new Map();
  for (const node of nodes) {
    for (const childId of node.c || []) parent.set(childId, node.id);
  }
  return parent;
}

function recomputeExclusivelyBadHighlight(nodes) {
  exclusivelyBadHighlightSet = new Set();
  if (!nodes.length) return;
  const parentMap = buildParentMap(nodes);
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));

  function addAncestors(nodeId) {
    let id = nodeId;
    while (id) {
      exclusivelyBadHighlightSet.add(id);
      id = parentMap.get(id);
    }
  }

  function addDescendants(nodeId) {
    function walk(id) {
      exclusivelyBadHighlightSet.add(id);
      const node = byId[id];
      if (!node?.c?.length) return;
      for (const childId of node.c) walk(childId);
    }
    walk(nodeId);
  }

  for (const [nodeId, status] of statusMap.entries()) {
    if (status === "exclusively_bad") {
      addAncestors(nodeId);
      addDescendants(nodeId);
    }
  }
}

function recomputeExpandedSubtreeHighlight(nodes) {
  expandedSubtreeHighlightSet = new Set();
  if (!nodes.length || !expansionMap.size) return;
  const parentMap = buildParentMap(nodes);
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));

  function addAncestors(nodeId) {
    let id = nodeId;
    while (id) {
      expandedSubtreeHighlightSet.add(id);
      id = parentMap.get(id);
    }
  }

  function addDescendants(nodeId) {
    function walk(id) {
      expandedSubtreeHighlightSet.add(id);
      const node = byId[id];
      if (!node?.c?.length) return;
      for (const childId of node.c) walk(childId);
    }
    walk(nodeId);
  }

  for (const nodeId of expansionMap.keys()) {
    addAncestors(nodeId);
    addDescendants(nodeId);
  }
}

function isExclusivelyBadHighlighted(nodeId) {
  return exclusivelyBadHighlightSet.has(nodeId);
}

function isExpandedSubtreeHighlighted(nodeId) {
  return expandedSubtreeHighlightSet.has(nodeId);
}

function recomputeCandidateStatus(nodes, leafMap) {
  const status = new Map();
  for (const node of nodes) {
    if (!node.c || !node.c.length) continue;
    const leafIds = leafDescendants(nodes, node.id);
    if (leafIds.length < 2) continue;
    const anyCorrect = leafIds.some(id => isLeafCorrect(leafMap.get(id)));
    status.set(node.id, anyCorrect ? "ditched" : "exclusively_bad");
  }
  return status;
}

}

function treePositions(nodes, rootId = "root") {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  function leafIds(nodeId) {
    const node = byId[nodeId];
    if (!node.c || !node.c.length) return [nodeId];
    return node.c.flatMap(leafIds);
  }
  const leafOrder = leafIds(rootId);
  const leafX = Object.fromEntries(leafOrder.map((id, i) => [id, i]));
  const positions = {};
  function assign(nodeId) {
    const node = byId[nodeId];
    let x;
    if (!node.c || !node.c.length) x = leafX[nodeId];
    else x = node.c.reduce((sum, cid) => sum + assign(cid), 0) / node.c.length;
    positions[nodeId] = { x, y: -node.d };
    return x;
  }
  assign(rootId);
  return positions;
}

function buildEdges(nodes, minProb) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const edges = [];
  for (const node of nodes) {
    for (const childId of node.c || []) {
      const child = byId[childId];
      if (!child || child.p < minProb) continue;
      edges.push({ source: node.id, target: childId, prob: child.p, token: child.tok || "?" });
    }
  }
  return edges;
}

function visibleNodeIds(edges) {
  const ids = new Set(["root"]);
  edges.forEach(e => { ids.add(e.source); ids.add(e.target); });
  return ids;
}

function nodeFill(node) {
  const stats = statsMap.get(node.id);
  if (stats) {
    if (stats.color_class === "exclusively_bad") return "var(--bad-node)";
    if (stats.color_class === "exclusively_good") return "var(--good-node)";
    if (stats.color_class === "mostly_bad") return "var(--mostly-bad)";
    return "var(--internal)";
  }
  if (!node.c || !node.c.length) {
    const leaf = leafMap.get(node.id);
    if (leaf && isLeafCorrect(leaf)) return "var(--good-node)";
    if (leaf && isLeafBad(leaf)) return "var(--bad-node)";
    if (leaf) return "var(--internal)";
  }
  if (node.id === "root") return "var(--accent)";
  return "var(--internal)";
}

function nodeStroke(node) {
  if (node.id === selectedNodeId) return "#fff";
  const expansion = expansionMap.get(node.id);
  if (expansion) {
    if (expansion.outcome_after_rescore === "ditched") return "var(--expanded-ditched)";
    return "var(--expanded)";
  }
  const stats = statsMap.get(node.id);
  if (stats?.color_class === "exclusively_bad") return "#ff8a80";
  if (stats?.color_class === "mostly_bad") return "#ffe082";
  if (stats?.color_class === "exclusively_good") return "#a5d6a7";
  return "#222";
}

function nodeRadius(node) {
  if (node.id === selectedNodeId) return 9;
  if (expansionMap.has(node.id)) return 8;
  const stats = statsMap.get(node.id);
  if (stats?.color_class === "exclusively_bad") return 8;
  if (stats?.color_class === "mostly_bad") return 7;
  if (stats?.color_class === "exclusively_good") return 7;
  if (statusMap.get(node.id) === "ditched") return 6;
  if (!node.c || !node.c.length) return 5;
  return 4;
}

function colorClassLabel(colorClass) {
  if (colorClass === "exclusively_bad") return "100% bad";
  if (colorClass === "mostly_bad") return ">75% bad";
  if (colorClass === "exclusively_good") return "100% good";
  return "mixed";
}

function pillClassForStats(stats) {
  if (!stats) return "";
  if (stats.color_class === "exclusively_bad") return "bad-node";
  if (stats.color_class === "mostly_bad") return "mostly-bad";
  if (stats.color_class === "exclusively_good") return "good-node";
  return "ditched";
}

function renderRunMeta(run) {
  const s = run.summary || {};
  const leaves = [...leafMap.values()];
  const nBad = leaves.filter(leaf => isLeafBad(leaf)).length;
  const nGood = leaves.filter(leaf => isLeafCorrect(leaf)).length;
  const nOther = leaves.filter(leaf => isLeafNeutral(leaf)).length;
  const probs = computeLeafProbabilityMasses(leaves);
  const exclBad = [...statusMap.values()].filter(st => st === "exclusively_bad").length;
  const expSummary = run.expansion_summary || {};
  const expansionLine = run.has_expansion && expSummary.nodes_expanded != null
    ? `<div class="muted" style="margin-top:6px">Expanded ${expSummary.nodes_expanded} nodes · ditched after ${expSummary.nodes_ditched_after || 0} · avg τ* ${fmtVal(expSummary.avg_tau_star)}</div>`
    : "";
  document.getElementById("runMeta").innerHTML = [
    `<div><strong>${run.country_name}</strong> · ${run.region_label}</div>`,
    `<div>${MODEL_LABELS[run.model_id] || run.model_id} · ${run.instruction_variant}</div>`,
    `<div>prefix ${run.prefix_length} · seed ${run.seed}</div>`,
    `<div>Greedy: <span class="pill ${run.greedy_correct ? "yes" : "no"}">${run.greedy_correct ? "correct" : "wrong"}</span></div>`,
    `<div class="muted" style="margin-top:6px">τ mass above leaves: ${fmtProb(probs.totalMass)}</div>`,
    expansionLine,
  ].join("");
  document.getElementById("statGrid").innerHTML = `
    <div class="stat"><strong>${exclBad}</strong><span class="muted">exclusively bad</span></div>
    <div class="stat"><strong>${nBad}</strong><span class="muted">bad leaves</span></div>
    <div class="stat"><strong>${nGood}</strong><span class="muted">good leaves</span></div>
    <div class="stat"><strong>${nOther}</strong><span class="muted">other leaves</span></div>
    <div class="stat"><strong>${fmtVal(probs.probGoodPct)}%</strong><span class="muted">P(good)</span></div>
    <div class="stat"><strong>${fmtVal(probs.probBadPct)}%</strong><span class="muted">P(bad)</span></div>
    <div class="stat"><strong>${fmtVal(probs.probOtherPct)}%</strong><span class="muted">P(other)</span></div>
  `;
}

function renderBadNodeList(run) {
  const list = document.getElementById("badNodeList");
  const entries = [...statsMap.entries()]
    .map(([nodeId, stats]) => ({ nodeId, ...stats }))
    .filter(item => item.bad_pct > 0)
    .sort((a, b) => b.bad_pct - a.bad_pct || b.n_leaves - a.n_leaves);

  if (!entries.length) {
    list.innerHTML = '<p class="muted">No bad leaf descendants in this tree.</p>';
    return;
  }

  list.innerHTML = entries.map(n => {
    const expansion = expansionMap.get(n.nodeId);
    const expansionBadge = expansion
      ? `<span class="pill" style="background:#4a3010;color:var(--expanded)">expanded · τ*=${fmtVal(expansion.tau_star)}</span>`
      : `<span class="pill ditched">baseline</span>`;
    return `
    <div class="card node-card ${n.color_class === "mostly_bad" ? "mostly-bad" : n.color_class === "exclusively_good" ? "exclusively-good" : ""}" data-node="${n.nodeId}">
      <div><strong>${n.nodeId}</strong></div>
      <div class="muted">${n.n_bad}/${n.n_leaves} bad · ${n.bad_pct_display}% error</div>
      <span class="pill ${pillClassForStats(n)}">${colorClassLabel(n.color_class)}</span>
      ${expansionBadge}
    </div>
  `;
  }).join("");
  list.querySelectorAll(".node-card").forEach(card => {
    card.addEventListener("click", () => selectNode(card.dataset.node));
  });
}

function renderLeafCard(leaf) {
  const bad = isLeafBad(leaf);
  const correct = isLeafCorrect(leaf);
  const cardClass = correct ? "correct" : bad ? "incorrect" : "neutral";
  const subtypes = classifyBadSubtypes(leaf).filter(s => s !== "correct");
  const subtypePills = subtypes.length
    ? subtypes.map(s => `<span class="pill ditched">${SUBTYPE_LABELS[s] || s}</span>`).join(" ")
    : '<span class="pill yes">correct</span>';
  return `
    <div class="card leaf-card ${cardClass}">
      <div class="muted">${leaf.leaf_id} · p=${fmtProb(leaf.path_prob)}</div>
      <div class="answer">${leaf.answer_text ? escapeHtml(leaf.answer_text) : "<em class='muted'>no answer</em>"}</div>
      <div style="margin-top:8px">
        <span class="pill ${correct ? "yes" : bad ? "no" : "ditched"}">${correct ? "good" : bad ? "bad" : "other"}</span>
        ${subtypePills}
        ${leaf.reasoning_complete ? '<span class="pill yes">complete</span>' : '<span class="pill no">incomplete</span>'}
      </div>
    </div>
  `;
}

function renderDetailPanel(nodeId) {
  const panel = document.getElementById("detailPanel");
  const title = document.getElementById("detailTitle");
  if (!nodeId) {
    title.textContent = "All leaf completions";
    const leaves = [...leafMap.values()].sort((a, b) => b.path_prob - a.path_prob);
    panel.innerHTML = leaves.length
      ? leaves.map(renderLeafCard).join("")
      : '<p class="muted">No completions.</p>';
    return;
  }
  const status = statusMap.get(nodeId);
  const stats = statsMap.get(nodeId);
  const expansion = expansionMap.get(nodeId);
  const leaves = leafDescendants(currentNodes, nodeId)
    .map(id => leafMap.get(id))
    .filter(Boolean)
    .sort((a, b) => b.path_prob - a.path_prob);
  const subtreeProbs = computeLeafProbabilityMasses(leaves);
  title.textContent = `Subtree: ${nodeId}`;
  const expansionBlock = expansion ? `
    <div class="card" style="border-color:var(--expanded)">
      <span class="pill" style="background:#4a3010;color:var(--expanded)">expanded</span>
      <div class="muted" style="margin-top:6px">
        τ* ${fmtVal(expansion.tau_star)} (from ${fmtVal(expansion.tau_original)}) ·
        leaves ${expansion.leaves_before} → ${expansion.leaves_after} ·
        ${(expansion.new_leaf_ids || []).length} new leaves ·
        outcome: ${expansion.outcome_after_rescore}
        ${expansion.hit_tau_floor ? " · hit τ floor" : ""}
      </div>
    </div>
  ` : "";
  panel.innerHTML = `
    <div class="card">
      ${stats ? `<span class="pill ${pillClassForStats(stats)}">${stats.bad_pct_display}% bad · ${colorClassLabel(stats.color_class)}</span>` : ""}
      ${status ? `<span class="pill ${status === "exclusively_bad" ? "bad-node" : "ditched"}">${status}</span>` : ""}
      <div class="muted" style="margin-top:6px">${leaves.length} leaves · ${leaves.filter(l => isLeafCorrect(l)).length} good · ${leaves.filter(l => isLeafBad(l)).length} bad · ${leaves.filter(l => isLeafNeutral(l)).length} other · P(good)=${fmtVal(subtreeProbs.probGoodPct)}% · P(bad)=${fmtVal(subtreeProbs.probBadPct)}%</div>
    </div>
    ${expansionBlock}
    ${leaves.map(renderLeafCard).join("")}
  `;
}

function selectNode(nodeId) {
  selectedNodeId = nodeId;
  renderDetailPanel(nodeId);
  if (currentRun) {
    const minProb = parseFloat(document.getElementById("probFilter").value);
    drawGraph(currentNodes, minProb);
  }
  focusNode(nodeId);
}

function focusNode(nodeId) {
  if (!gRoot) return;
  const node = gRoot.selectAll(".node").filter(d => d.id === nodeId);
  if (node.empty()) return;
  const [[x, y]] = node.data().map(d => [d.sx, d.sy]);
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  svg.transition().duration(500).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(width / 2, height / 2).scale(1.4).translate(-x, -y)
  );
}

function drawGraph(nodes, minProb) {
  if (!svg || !gRoot) return;
  currentNodes = nodes;
  const highlightBadOnly = document.getElementById("highlightBadOnly").checked;
  const showExpandedOnly = document.getElementById("showExpandedOnly")?.checked;

  const positions = treePositions(nodes);
  const edges = buildEdges(nodes, minProb);
  const visible = visibleNodeIds(edges);
  const graphNodes = nodes
    .filter(n => visible.has(n.id))
    .map(n => ({ ...n, ...positions[n.id] }));

  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  const xs = graphNodes.map(n => n.x);
  const ys = graphNodes.map(n => n.y);
  const padX = Math.max((Math.max(...xs) - Math.min(...xs)) * 0.08, 1);
  const padY = Math.max((Math.max(...ys) - Math.min(...ys)) * 0.08, 1);
  const xScale = d => (d - Math.min(...xs) + padX) * 28;
  const yScale = d => (d - Math.min(...ys) + padY) * 60;
  graphNodes.forEach(n => { n.sx = xScale(n.x); n.sy = yScale(n.y); });

  const byId = Object.fromEntries(graphNodes.map(n => [n.id, n]));
  const links = edges
    .filter(e => byId[e.source] && byId[e.target])
    .map(e => ({
      ...e,
      sx: byId[e.source].sx, sy: byId[e.source].sy,
      tx: byId[e.target].sx, ty: byId[e.target].sy,
    }));

  const maxProb = Math.max(...links.map(l => l.prob), 1e-9);
  gRoot.selectAll("*").remove();

  gRoot.selectAll(".link")
    .data(links, d => `${d.source}-${d.target}`)
    .join("line")
    .attr("class", "link")
    .attr("x1", d => d.sx).attr("y1", d => d.sy)
    .attr("x2", d => d.tx).attr("y2", d => d.ty)
    .attr("stroke", d => {
      const stats = statsMap.get(d.target);
      if (stats?.color_class === "exclusively_bad") return "var(--bad-node)";
      if (stats?.color_class === "mostly_bad") return "var(--mostly-bad)";
      if (stats?.color_class === "exclusively_good") return "var(--good-node)";
      const leaf = leafMap.get(d.target);
      if (leaf) {
        if (isLeafCorrect(leaf)) return "var(--good-node)";
        if (isLeafBad(leaf)) return "var(--bad-node)";
        return "var(--internal)";
      }
      return "#555";
    })
    .attr("stroke-width", d => 0.8 + 5 * (d.prob / maxProb))
    .attr("stroke-opacity", d => {
      if (showExpandedOnly) {
        return isExpandedSubtreeHighlighted(d.source) && isExpandedSubtreeHighlighted(d.target)
          ? 0.85
          : 0.12;
      }
      if (!highlightBadOnly) return 0.85;
      return isExclusivelyBadHighlighted(d.source) && isExclusivelyBadHighlighted(d.target)
        ? 0.85
        : 0.12;
    })
    .attr("stroke-linecap", "round");

  const node = gRoot.selectAll(".node")
    .data(graphNodes, d => d.id)
    .join("g")
    .attr("class", "node")
    .attr("transform", d => `translate(${d.sx},${d.sy})`)
    .attr("opacity", d => {
      if (showExpandedOnly && !isExpandedSubtreeHighlighted(d.id)) return 0.08;
      if (!highlightBadOnly) return 1;
      return isExclusivelyBadHighlighted(d.id) ? 1 : 0.15;
    })
    .style("cursor", "pointer")
    .on("click", (_, d) => selectNode(d.id));

  node.append("circle")
    .attr("r", d => nodeRadius(d))
    .attr("fill", d => nodeFill(d))
    .attr("stroke", d => nodeStroke(d))
    .attr("stroke-width", d => {
      if (d.id === selectedNodeId) return 2.5;
      if (expansionMap.has(d.id)) return 2.5;
      return statusMap.get(d.id) === "exclusively_bad" ? 2 : 1;
    });

  node.filter(d => expansionMap.has(d.id))
    .append("circle")
    .attr("r", d => nodeRadius(d) + 4)
    .attr("fill", "none")
    .attr("stroke", d => {
      const exp = expansionMap.get(d.id);
      return exp?.outcome_after_rescore === "ditched" ? "var(--expanded-ditched)" : "var(--expanded)";
    })
    .attr("stroke-width", 2);

  node.append("text")
    .attr("dy", d => (d.c && d.c.length ? -12 : 14))
    .attr("text-anchor", "middle")
    .attr("fill", "#ccc")
    .attr("font-size", "10px")
    .attr("font-family", "ui-monospace, monospace")
    .text(d => {
      if (d.id === "root") return "prompt";
      const tok = displayToken(d.tok);
      return tok.length > 12 ? tok.slice(0, 10) + "…" : tok;
    });

  node.filter(d => statsMap.has(d.id) && (d.c && d.c.length))
    .append("text")
    .attr("dy", 16)
    .attr("text-anchor", "middle")
    .attr("fill", d => {
      const stats = statsMap.get(d.id);
      if (stats?.color_class === "exclusively_bad") return "#ff8a80";
      if (stats?.color_class === "mostly_bad") return "#ffe082";
      if (stats?.color_class === "exclusively_good") return "#a5d6a7";
      return "#aaa";
    })
    .attr("font-size", "9px")
    .text(d => `${statsMap.get(d.id).bad_pct_display}%`);

  const tooltip = document.getElementById("tooltip");
  node.on("mouseenter", (event, d) => {
    const status = statusMap.get(d.id);
    const stats = statsMap.get(d.id);
    const leaf = leafMap.get(d.id);
    let html = `<div class="tok">${escapeHtml(displayToken(d.id === "root" ? null : d.tok))}</div>`;
    html += `<div>id: ${d.id} · depth ${d.d}</div>`;
    html += `<div>path prob: ${fmtProb(d.p)}</div>`;
    if (stats) {
      html += `<div><span class="pill ${pillClassForStats(stats)}">${stats.bad_pct_display}% bad (${stats.n_bad}/${stats.n_leaves})</span></div>`;
    }
    if (status) html += `<div><span class="pill ${status === "exclusively_bad" ? "bad-node" : "ditched"}">${status}</span></div>`;
    const expansion = expansionMap.get(d.id);
    if (expansion) {
      html += `<div><span class="pill" style="background:#4a3010;color:var(--expanded)">expanded · τ* ${fmtVal(expansion.tau_star)}</span></div>`;
    }
    if (leaf) html += `<div style="margin-top:6px">${escapeHtml(leaf.answer_text || "(no answer)")}</div>`;
    tooltip.innerHTML = html;
    tooltip.style.display = "block";
  }).on("mousemove", event => {
    tooltip.style.left = (event.clientX + 14) + "px";
    tooltip.style.top = (event.clientY + 14) + "px";
  }).on("mouseleave", () => { tooltip.style.display = "none"; });

  fitToScreen();
}

function fitToScreen() {
  if (!gRoot || !svg) return;
  const bounds = gRoot.node().getBBox();
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;
  if (!bounds.width || !bounds.height) return;
  const midX = bounds.x + bounds.width / 2;
  const midY = bounds.y + bounds.height / 2;
  const scale = 0.9 / Math.max(bounds.width / width, bounds.height / height);
  svg.transition().duration(400).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(width / 2, height / 2).scale(scale).translate(-midX, -midY)
  );
}

function loadRun(treeKey) {
  const run = DATA.runs.find(r => r.tree_key === treeKey);
  const nodes = DATA.trees[treeKey];
  if (!run || !nodes) return;

  currentRun = run;
  currentNodes = nodes;
  selectedNodeId = null;
  leafMap = new Map(Object.entries((DATA.leaf_completions[treeKey] || {})));
  expansionMap = new Map(Object.entries((DATA.node_expansions?.[treeKey] || {})));
  statsMap = computeNodeErrorStatsMap(nodes, leafMap);
  statusMap = recomputeCandidateStatus(nodes, leafMap);
  recomputeExclusivelyBadHighlight(nodes);
  recomputeExpandedSubtreeHighlight(nodes);

  renderRunMeta(run);
  renderBadNodeList(run);
  renderDetailPanel(null);

  const minProb = parseFloat(document.getElementById("probFilter").value);
  drawGraph(nodes, minProb);
}

function initTreeExplorer() {
  svg = d3.select("#graph");
  gRoot = svg.append("g");
  zoomBehavior = d3.zoom()
    .scaleExtent([0.05, 8])
    .on("zoom", event => gRoot.attr("transform", event.transform));
  svg.call(zoomBehavior);

  document.getElementById("fitBtn").addEventListener("click", fitToScreen);
  document.getElementById("resetBtn").addEventListener("click", () => {
    svg.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity);
  });

  populateTreeFilters();
  refreshRunSelect(null);

  document.getElementById("runSelect").addEventListener("change", e => loadRun(e.target.value));
  document.getElementById("regionFilter").addEventListener("change", () => refreshRunSelect(currentRun?.tree_key));
  document.getElementById("countryFilter").addEventListener("change", () => refreshRunSelect(currentRun?.tree_key));
  document.getElementById("probFilter").addEventListener("change", () => {
    if (currentRun) loadRun(currentRun.tree_key);
  });
  document.getElementById("highlightBadOnly").addEventListener("change", () => {
    if (currentRun) {
      const minProb = parseFloat(document.getElementById("probFilter").value);
      drawGraph(currentNodes, minProb);
    }
  });
  document.getElementById("showExpandedOnly").addEventListener("change", () => {
    if (currentRun) {
      const minProb = parseFloat(document.getElementById("probFilter").value);
      drawGraph(currentNodes, minProb);
    }
  });
  for (const item of BAD_SUBTYPE_OPTIONS) {
    document.getElementById(`badFilter_${item.id}`).addEventListener("change", refreshStatsForMode);
  }
  document.getElementById("badPresetAll").addEventListener("click", () => {
    setBadSubtypeFilters(BAD_SUBTYPE_OPTIONS.map(item => item.id));
    refreshStatsForMode();
  });
  document.getElementById("badPresetWrongOnly").addEventListener("click", () => {
    setBadSubtypeFilters(["wrong_city"]);
    refreshStatsForMode();
  });
}

function init() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });
  populateSummaryFilters();
  ["prefixFilter", "variantFilter", "summaryRegionFilter", "summaryCountryFilter", "aggSelect", "metricSelect"]
    .forEach(id => document.getElementById(id).addEventListener("change", renderSummary));

  renderSummary();
  initTreeExplorer();
  window.addEventListener("resize", () => applyFrozenColumns());

  const partial = DATA.bad_nodes_trees < DATA.mech_interp_trees;
  document.getElementById("source").textContent =
    `Source: ${DATA.source} · generated ${DATA.generated_at} · ` +
    `${DATA.bad_nodes_trees}/${DATA.mech_interp_trees} trees analyzed` +
    (partial ? " (pipeline still running — rebuild dashboard when complete)" : "");
}

fetch(`capitals_dashboard.json?ts=${Date.now()}`)
  .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
  .then(data => {
    DATA = data;
    treeProbMassIndex = buildTreeProbMassIndex();
    init();
  })
  .catch(err => {
    document.getElementById("source").innerHTML =
      `<span class="error">Failed to load capitals_dashboard.json: ${err.message}. Serve output/capitals/ via HTTP.</span>`;
  });
</script>
</body>
