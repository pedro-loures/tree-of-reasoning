models:
  - id: deepseek-r1-7b
    hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    hf_batch_size: 4

countries_file: configs/countries.yaml

vllm:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  trust_remote_code: true
  enforce_eager: false

experiment:
  # 210 conditions: 30 countries x 7 (6 legacy prefix lengths + 1 plain), seed 0
  instruction_sweeps:
    - template: legacy
      prefix_lengths: [0, 50, 200, 500, 1000, 2000]
      seeds: [0]
    - template: plain
      prefix_lengths: [0]
      seeds: [0]
  tau: 0.01
  max_tree_depth: 512
  top_k_leaves: 5
  breadth_warning_threshold: 20
  temperature: 0.0
  max_completion_tokens: 4096
  reasoning_probe_max_tokens: 8
  logprobs_limit: 20
  hf_batch_size: 4
  numerical_floor: 1.0e-12
  capture_hidden_states: false
  embeddings_dir: embeddings
  top_k_logprobs: 20

results_dir: results/capitals_mech_interp
